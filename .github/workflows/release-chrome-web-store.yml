name: Release to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment to publish
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Only one release may bump, upload, and publish at a time.
concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # A manual run must target main, so the version commit and tag are always
    # created from the release branch rather than an arbitrary feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Increment extension version
        run: npm run version:bump:${{ inputs.release_type }}

      # Test and package the exact version that will be uploaded to the store.
      - run: npm run check
      - run: npm run package

      - name: Publish to Chrome Web Store
        run: npm run publish:chrome-store
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY_JSON }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE || 'DEFAULT_PUBLISH' }}
          CWS_SKIP_REVIEW: ${{ vars.CWS_SKIP_REVIEW || 'false' }}
          CWS_BLOCK_ON_WARNINGS: ${{ vars.CWS_BLOCK_ON_WARNINGS || 'true' }}
          CWS_DEPLOY_PERCENTAGE: ${{ vars.CWS_DEPLOY_PERCENTAGE }}

      - name: Commit version and create release tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "ReplyLoom v${VERSION}"
          git push origin HEAD:main --follow-tags
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ReplyLoom-${{ steps.version.outputs.version }}-chrome
          path: release/ReplyLoom-${{ steps.version.outputs.version }}-chrome.zip
          if-no-files-found: error
